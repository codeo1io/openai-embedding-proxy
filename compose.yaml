services:
  embedding-proxy:
    build: .
    restart: unless-stopped
    ports:
      - "18473:18473"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: /data/openai_api_key
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-60}
    volumes:
      - embedding_proxy_data:/data

volumes:
  embedding_proxy_data:
